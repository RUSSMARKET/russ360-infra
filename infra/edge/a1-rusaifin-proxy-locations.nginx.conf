# Keep the complete browser-visible auth path on the canary address. These
# namespaces belong to Rusaiauth; /auth and /auth/callback remain Rusaifin SPA
# routes and therefore fall through to the generic location below.
location ~ ^/(?:oauth/|oidc/|api/v1/|build/assets/|preview/|auth/(?:login|recovery|register)(?:/|$)|(?:login|logout)$|favicon\.svg$|\.well-known/openid-configuration$) {
    proxy_pass https://82.146.57.149;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name sso.rusaifin.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # Both upstream virtual hosts share one IP. Do not reuse a TLS session
    # negotiated for the other SNI name.
    proxy_ssl_session_reuse off;

    proxy_set_header Host sso.rusaifin.ru;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_request_buffering off;

    proxy_redirect https://sso.rusaifin.ru/ https://$host/;
    sub_filter_once off;
    sub_filter_types application/json;
    sub_filter 'https://sso.rusaifin.ru' 'https://$host';
    sub_filter 'https:\/\/sso.rusaifin.ru' 'https:\/\/$host';
}

location / {
    proxy_pass https://82.146.57.149;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name fintech.rusaifin.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_session_reuse off;

    proxy_set_header Host fintech.rusaifin.ru;
    # The canary is a separate browser origin. Keep runtime API/OIDC XHR
    # calls on that origin so the test does not depend on CORS at the
    # production hostname.
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;

    proxy_redirect https://fintech.rusaifin.ru/ https://$host/;
    proxy_cookie_domain fintech.rusaifin.ru $host;
    sub_filter_once off;
    # Some production bundles resolve legacy hostnames before Nuxt
    # runtimeConfig is hydrated. Install a canary-only transport shim before
    # the cached bundle executes, keeping fetch/XHR traffic on this ingress.
    sub_filter '<head>' "<head><script>(()=>{const h=new Set(['server.rusaifin.ru','fintech.rusaifin.ru','sso.rusaifin.ru']);const r=u=>{try{const v=new URL(u,location.href);if(h.has(v.hostname)){v.protocol=(v.protocol==='ws:'||v.protocol==='wss:')?'wss:':location.protocol;v.host=location.host;return v.href}}catch(e){}return u};const f=window.fetch;window.fetch=function(i,n){if(typeof i==='string'||i instanceof URL)return f.call(this,r(String(i)),n);if(i instanceof Request){const u=r(i.url);if(u!==i.url)i=new Request(u,i)}return f.call(this,i,n)};const o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u,...a){return o.call(this,m,r(String(u)),...a)}})();</script>";
    sub_filter 'apiBaseUrl:"https://fintech.rusaifin.ru"' 'apiBaseUrl:"https://$host"';
    sub_filter 'oidcXhrBase:"https://fintech.rusaifin.ru"' 'oidcXhrBase:"https://$host"';
    sub_filter 'oidcIssuer:"https://sso.rusaifin.ru"' 'oidcIssuer:"https://$host"';
}
