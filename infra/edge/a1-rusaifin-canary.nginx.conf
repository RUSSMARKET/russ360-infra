server {
    listen 80 default_server;
    server_name 82.146.45.198 edge2.rusaifin.ru;

    access_log /var/log/nginx/a1-rusaifin-canary.access.log rusaifin_canary;
    error_log  /var/log/nginx/a1-rusaifin-canary.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name 82.146.45.198;

    ssl_certificate     /etc/letsencrypt/live/82.146.45.198/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.146.45.198/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:a1_rusaifin_tls:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/a1-rusaifin-canary.access.log rusaifin_canary;
    error_log  /var/log/nginx/a1-rusaifin-canary.error.log crit;

    add_header X-Rusaifin-Canary-Ingress a1-shake always;
    client_max_body_size 32m;

    include /etc/nginx/snippets/a1-rusaifin-proxy-locations.conf;
}

