server {
    listen 80 default_server;
    server_name 82.146.45.198 edge2.rusaifin.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}
