server {
    listen 80 default_server;
    server_name 82.146.45.198 edge2.rusaifin.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name 82.146.45.198;

    ssl_certificate     /etc/letsencrypt/live/82.146.45.198/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.146.45.198/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:a1_rusaifin_tls:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/a1-rusaifin-canary.access.log;
    error_log  /var/log/nginx/a1-rusaifin-canary.error.log warn;

    add_header X-Rusaifin-Canary-Ingress a1-shake always;
    client_max_body_size 32m;

    location / {
        proxy_pass https://82.146.57.149;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name fintech.rusaifin.ru;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Host fintech.rusaifin.ru;
        # The canary is a separate browser origin. Keep runtime API/OIDC XHR
        # calls on that origin so the test does not depend on CORS at the
        # production hostname.
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;

        proxy_redirect https://fintech.rusaifin.ru/ https://$host/;
        proxy_cookie_domain fintech.rusaifin.ru $host;
        sub_filter_once off;
        # Some production bundles resolve the legacy API hostname before Nuxt
        # runtimeConfig is hydrated. Install a canary-only transport shim before
        # the cached bundle executes, keeping fetch/XHR traffic on this ingress.
        sub_filter '<head>' "<head><script>(()=>{const h=new Set(['server.rusaifin.ru','fintech.rusaifin.ru']);const r=u=>{try{const v=new URL(u,location.href);if(h.has(v.hostname)){v.protocol=(v.protocol==='ws:'||v.protocol==='wss:')?'wss:':location.protocol;v.host=location.host;return v.href}}catch(e){}return u};const f=window.fetch;window.fetch=function(i,n){if(typeof i==='string'||i instanceof URL)return f.call(this,r(String(i)),n);if(i instanceof Request){const u=r(i.url);if(u!==i.url)i=new Request(u,i)}return f.call(this,i,n)};const o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u,...a){return o.call(this,m,r(String(u)),...a)}})();</script>";
        sub_filter 'apiBaseUrl:"https://fintech.rusaifin.ru"' 'apiBaseUrl:"https://$host"';
        sub_filter 'oidcXhrBase:"https://fintech.rusaifin.ru"' 'oidcXhrBase:"https://$host"';
    }
}

