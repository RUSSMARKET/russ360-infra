# Structured transport diagnostics for selected rusaifin.ru vhosts.
#
# This file only declares a log format. A vhost starts emitting these records
# after it includes nginx.ssl.conf_rusaifin_netdiag. Query strings and referrers
# are intentionally omitted: OAuth callbacks and consent links may contain
# sensitive values.
log_format rusaifin_netdiag escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"msec":$msec,'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"server_name":"$server_name",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_length":$request_length,'
      '"bytes_sent":$bytes_sent,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"request_completion":"$request_completion",'
      '"connection":$connection,'
      '"connection_requests":$connection_requests,'
      '"protocol":"$server_protocol",'
      '"ssl_protocol":"$ssl_protocol",'
      '"ssl_cipher":"$ssl_cipher",'
      '"ssl_alpn":"$ssl_alpn_protocol",'
      '"ssl_early_data":"$ssl_early_data",'
      '"gzip_ratio":"$gzip_ratio",'
      '"content_type":"$sent_http_content_type",'
      '"content_length":"$sent_http_content_length",'
      '"range":"$http_range",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"user_agent":"$http_user_agent"'
    '}';
