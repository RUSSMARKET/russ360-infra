# Query strings, referrers, cookies and authorization headers are deliberately
# excluded: OAuth callbacks carry one-time codes that must not enter logs.
log_format rusaifin_canary
    '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time '
    'ua="$http_user_agent" upstream="$upstream_addr" us="$upstream_status"';
