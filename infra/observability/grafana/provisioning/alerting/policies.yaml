apiVersion: 1

# Everything is delivered to the bot's triage webhook (tgbot-triage) — it filters
# noise and posts a short AI verdict — EXCEPT the bot's own dead-man switch, which
# must bypass the bot (undeliverable when the bot is down) and go straight to telegram.
policies:
  - orgId: 1
    receiver: tgbot-triage
    group_by: ['alertname', 'service', 'env']
    group_wait: 30s
    group_interval: 10m
    # Telegram is an attention channel, not a live dashboard.  A warning is sent
    # once per day while it remains active; the dashboard keeps the full state.
    repeat_interval: 24h
    routes:
      # Dead-man switch: bypass the bot, deliver directly to telegram.
      - receiver: telegram-russ360
        matchers:
          - deadman = true
        group_wait: 10s
        repeat_interval: 1h
      # Critical alerts still go through triage, with a reminder during a long
      # incident but without the old hourly flood.
      - receiver: tgbot-triage
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 6h
